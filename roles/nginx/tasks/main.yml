# nginx/tasks/main.yml
#
---

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: >-
      This role supports only Debian OS family
      (found {{ ansible_os_family }}).
  when: ansible_os_family != 'Debian'

- name: "Load {{ ansible_os_family }}-specific variables"
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install required packages
  ansible.builtin.import_tasks: install.yml

- name: Configure service
  ansible.builtin.import_tasks: configure.yml

- name: "Ensure {{ nginx_service }} service is started and enabled on boot"
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true
  become: true
