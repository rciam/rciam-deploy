# file: opa/tasks/service.yml
#
---

- name: Install OPA systemd unit
  template:
    src: opa.service.j2
    dest: /etc/systemd/system/opa.service
    owner: root
    group: root
    mode: "0644"
  become: true
  register: opa_unit
  notify: Restart opa

- name: Enable and start the OPA service
  systemd:
    name: opa
    state: started
    enabled: yes
    daemon_reload: "{{ opa_unit is changed }}"
  become: true
